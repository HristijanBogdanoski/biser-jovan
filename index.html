<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
  :root { --green:#1e4a2c; --green-2:#2c6440; --cream:#f6f1e6; --ink:#1b2a20; --gold:#b89b5e; --red:#b5352b; --muted:#5d6b61; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-text-size-adjust:100%; }
  body { min-height:100vh; background:#e9e3d6; color:var(--ink);
    font-family:"Avenir Next","Avenir","Mulish","Helvetica Neue",sans-serif;
    display:flex; justify-content:center; padding:24px 16px calc(32px + env(safe-area-inset-bottom)); }
  .serif { font-family:"Baskerville","Libre Baskerville","Georgia",serif; }
  main { width:100%; max-width:420px; }

  .card { border-radius:14px; overflow:hidden; background:var(--cream); box-shadow:0 10px 30px rgba(20,40,25,.18), 0 2px 6px rgba(20,40,25,.10); }

  .head { background:radial-gradient(120% 90% at 30% 20%, var(--green-2), var(--green) 60%, #163a22);
    color:var(--cream); text-align:center; padding:38px 20px 30px; }
  .brand { font-size:34px; font-weight:700; letter-spacing:.28em; padding-left:.28em; line-height:1; }
  .brand-sub { font-size:12px; letter-spacing:.55em; padding-left:.55em; margin-top:10px; color:#e3dac6; }
  .rule { width:90px; height:1px; background:var(--gold); margin:18px auto 14px; }
  .tag { font-size:10px; font-weight:600; letter-spacing:.32em; padding-left:.32em; color:#d8cfba; }

  .body { padding:28px 26px 26px; }
  .name { font-size:27px; font-weight:700; line-height:1.1; }
  .title { font-size:11px; font-weight:700; letter-spacing:.34em; color:var(--green-2); margin-top:8px; }
  .accent { width:38px; height:2px; background:var(--red); margin:18px 0 8px; }

  .rows { list-style:none; }
  .rows a { display:grid; grid-template-columns:28px 1fr; align-items:baseline; padding:11px 0;
    color:inherit; text-decoration:none; border-bottom:1px solid rgba(30,74,44,.10); font-size:16px; font-weight:500; line-height:1.35; }
  .rows li:last-child a { border-bottom:0; }
  .rows .k { color:var(--green-2); font-weight:700; font-size:13px; }
  .rows small { display:block; color:var(--muted); font-size:12px; font-weight:500; margin-top:1px; }
  .rows a:active { background:rgba(30,74,44,.05); }

  .save { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; margin-top:22px;
    padding:17px 20px; border-radius:10px; background:var(--green); color:var(--cream); text-decoration:none;
    font-size:16px; font-weight:700; letter-spacing:.04em; box-shadow:0 4px 12px rgba(30,74,44,.25); }
  .save:active { transform:translateY(1px); background:#173d24; }
  .save svg { width:20px; height:20px; flex:none; }
  .hint { text-align:center; font-size:12px; color:var(--muted); margin-top:10px; }

  .band { background:var(--green); color:#dfe7df; font-size:10px; letter-spacing:.3em; padding:14px 26px; }
  .band a { color:inherit; text-decoration:none; float:right; letter-spacing:.12em; }
</style>

</html>
